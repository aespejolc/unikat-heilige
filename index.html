<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unikat-Profil: Dein Heiligenbild</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Sans+Pro:wght@400;600&display=swap');

        :root {
            --bg-color: #fdfbf7; /* Parchment/Elfenbein */
            --text-color: #2c3e50;
            --primary-color: #0f254b; /* Sakrales Dunkelblau */
            --accent-color: #c5a059; /* Edles Gold */
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Source Sans Pro', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 37, 75, 0.08);
            border-top: 6px solid var(--accent-color);
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 2.4em;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 1.6em;
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .quote {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1em;
            color: #555;
            margin-bottom: 40px;
        }

        .section {
            margin-bottom: 45px;
            padding: 30px;
            background: #f8fafb;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .question {
            margin-bottom: 30px;
        }

        label.question-title {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1.1em;
            color: var(--primary-color);
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-item, .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }

        .radio-item:hover, .checkbox-item:hover {
            background: #f0f4f8;
            border-color: var(--primary-color);
        }

        input[type="radio"], input[type="checkbox"] {
            margin-top: 4px;
            transform: scale(1.1);
            accent-color: var(--accent-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Source Sans Pro', sans-serif;
            box-sizing: border-box;
            margin-top: 8px;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.2);
        }

        .other-input {
            display: none;
            margin-top: 10px;
            margin-left: 30px;
            width: calc(100% - 30px) !important;
            border-color: var(--accent-color) !important;
        }

        .color-meaning {
            font-size: 0.85em;
            color: #64748b;
            display: block;
            margin-top: 2px;
        }

        .gender-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .gender-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            color: var(--primary-color);
            transition: all 0.2s;
        }

        .gender-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 6px rgba(15, 37, 75, 0.2);
        }

        .image-preview-container {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            background: white;
        }

        .image-preview-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(197, 160, 89, 0.3);
            font-family: 'Source Sans Pro', sans-serif;
        }

        .btn:hover {
            background-color: #ad8c4e;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(197, 160, 89, 0.4);
        }

        .btn-secondary {
            background-color: var(--primary-color);
            box-shadow: 0 4px 6px rgba(15, 37, 75, 0.3);
        }
        
        .btn-secondary:hover {
            background-color: #17325b;
            box-shadow: 0 6px 12px rgba(15, 37, 75, 0.4);
        }

        .btn-danger {
            background-color: #f8fafb;
            color: #ef4444;
            border: 1px solid #ef4444;
            box-shadow: none;
            font-size: 14px;
            padding: 8px 16px;
            width: auto;
            margin-bottom: 30px;
            float: right;
        }

        .btn-danger:hover {
            background-color: #fef2f2;
            transform: none;
        }

        .btn-outline {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }

        .btn-outline:hover {
            background-color: #f0f4f8;
            transform: translateY(-2px);
        }

        #results {
            display: none;
            margin-top: 50px;
            padding-top: 40px;
            border-top: 4px solid var(--accent-color);
        }

        .prompt-box {
            background: #0f172a;
            color: #e2e8f0;
            padding: 25px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            border-left: 4px solid var(--accent-color);
        }

        .flex-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .flex-buttons .btn {
            flex: 1;
            margin-bottom: 0;
        }

        .hint {
            font-size: 0.9em;
            color: #718096;
            margin-top: -8px;
            margin-bottom: 12px;
            display: block;
            font-style: italic;
        }

        .clearfix::after
